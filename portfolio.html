<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Портфолио нашей веб-студии: примеры разработанных сайтов, мобильных приложений, кейсы по дизайну и интернет-маркетингу."
    />
    <meta name="author" content="Anatoliy Nosenko" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфолио</title>
    <link rel="icon" href="./images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/main.min.css" />
  </head>
  <body>
    <!-- Page header -->
    <header class="page-header">
      <div class="container page-header__container">
        <a class="logo" href="./" lang="en">
          <span class="logo--accent">Web</span> Studio
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Toggle mobile menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
          data-menu-button
        >
          <svg width="40" height="40" aria-hidden="true">
            <use
              class="menu-toggle__icon-menu"
              href="./images/icons.svg#menu"
            ></use>
            <use
              class="menu-toggle__icon-close"
              href="./images/icons.svg#close"
            ></use>
          </svg>
        </button>

        <div class="mobile-menu" id="mobile-menu" data-menu>
          <nav>
            <ul class="site-nav">
              <li class="site-nav__item">
                <a class="site-nav__link" href="./index.html">Студия</a>
              </li>
              <li class="site-nav__item">
                <a
                  class="site-nav__link site-nav__link--active"
                  href="./"
                  aria-current="page"
                >
                  Портфолио
                </a>
              </li>
              <li class="site-nav__item">
                <a class="site-nav__link" href="#">Контакты</a>
              </li>
            </ul>
          </nav>

          <div class="contacts">
            <a class="contacts__link" href="mailto:info@devstudio.com">
              <svg
                class="contacts__icon"
                width="16"
                height="12"
                aria-hidden="true"
              >
                <use href="./images/icons.svg#envelope"></use>
              </svg>
              info@devstudio.com
            </a>
            <a class="contacts__link" href="tel:+380961111111">
              <svg
                class="contacts__icon"
                width="10"
                height="15"
                aria-hidden="true"
              >
                <use href="./images/icons.svg#smartphone"></use>
              </svg>
              +38 096 111 11 11
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page main -->
    <main>
      <!-- Works -->
      <section class="section">
        <div class="container">
          <h1 class="visually-hidden">Наши работы</h1>

          <div class="filter" role="group" aria-labelledby="filter-title">
            <b class="visually-hidden" id="filter-title">Выберите проекты:</b>

            <ul class="filter__list">
              <li class="filter__item">
                <label class="filter__label">
                  <input
                    class="filter__input"
                    type="radio"
                    name="filter"
                    value="all"
                    checked
                  />
                  <span class="filter__button">Все</span>
                </label>
              </li>
              <li class="filter__item">
                <label class="filter__label">
                  <input
                    class="filter__input"
                    type="radio"
                    name="filter"
                    value="websites"
                  />
                  <span class="filter__button">Веб-сайты</span>
                </label>
              </li>
              <li class="filter__item">
                <label class="filter__label">
                  <input
                    class="filter__input"
                    type="radio"
                    name="filter"
                    value="apps"
                  />
                  <span class="filter__button">Приложения</span>
                </label>
              </li>
              <li class="filter__item">
                <label class="filter__label">
                  <input
                    class="filter__input"
                    type="radio"
                    name="filter"
                    value="design"
                  />
                  <span class="filter__button">Дизайн</span>
                </label>
              </li>
              <li class="filter__item">
                <label class="filter__label">
                  <input
                    class="filter__input"
                    type="radio"
                    name="filter"
                    value="marketing"
                  />
                  <span class="filter__button">Маркетинг</span>
                </label>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>

    <!-- Page footer -->
    <footer class="page-footer">
      <div class="container page-footer__container">
        <div class="page-footer__contacts">
          <a class="logo page-footer__logo" href="./index.html" lang="en">
            <span class="logo--accent">Web</span> Studio
          </a>

          <address class="page-footer__address">
            <a
              class="page-footer__link page-footer__link--map"
              href="https://maps.app.goo.gl/Gkqo7Z41vK2xTPrL8"
              target="_blank"
              rel="noopener noreferrer"
            >
              г. Киев, пр-т Леси Украинки, 26
            </a>
            <a class="page-footer__link" href="mailto:info@example.com">
              info@example.com
            </a>
            <a class="page-footer__link" href="tel:+380991111111">
              +38 099 111 11 11
            </a>
          </address>
        </div>

        <div class="page-footer__socials">
          <b class="page-footer__text">Присоединяйтесь</b>

          <ul class="social-networks">
            <li class="social-networks__item">
              <a
                class="social-networks__link social-networks__link--theme-dark"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
              >
                <svg class="social-networks__icon" aria-hidden="true">
                  <use href="./images/icons.svg#instagram"></use>
                </svg>
              </a>
            </li>
            <li class="social-networks__item">
              <a
                class="social-networks__link social-networks__link--theme-dark"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Twitter"
              >
                <svg class="social-networks__icon" aria-hidden="true">
                  <use href="./images/icons.svg#twitter"></use>
                </svg>
              </a>
            </li>
            <li class="social-networks__item">
              <a
                class="social-networks__link social-networks__link--theme-dark"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
              >
                <svg class="social-networks__icon" aria-hidden="true">
                  <use href="./images/icons.svg#facebook"></use>
                </svg>
              </a>
            </li>
            <li class="social-networks__item">
              <a
                class="social-networks__link social-networks__link--theme-dark"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
              >
                <svg class="social-networks__icon" aria-hidden="true">
                  <use href="./images/icons.svg#linkedin"></use>
                </svg>
              </a>
            </li>
          </ul>
        </div>

        <div class="page-footer__form">
          <b class="page-footer__text">Подпишитесь на рассылку</b>

          <form class="subscribe-form">
            <label class="visually-hidden" for="email">E-mail</label>
            <input
              class="subscribe-form__input"
              type="email"
              name="email"
              id="email"
              placeholder="E-mail"
              autocomplete="email"
              required
            />

            <button class="button button--icon" type="submit">
              Подписаться
              <svg
                class="button__icon"
                width="24"
                height="24"
                aria-hidden="true"
              >
                <use href="./images/icons.svg#send"></use>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </footer>
  </body>
</html>
